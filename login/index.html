<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AURADash Studio</title>
    <link rel="stylesheet" href="../shared/style.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="dark-theme">
    <div class="login-container">
        <header class="login-header">
            <h1 class="logo"><span class="logo-aura">AURA</span><span class="logo-dash">Dash</span></h1>
            <p>Gestão para Estética e Salões</p>
        </header>

        <form id="login-form" class="auth-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary">Entrar</button>
            <p class="auth-switch">Não tem conta? <a href="#" id="go-to-signup">Cadastre seu Studio</a></p>
        </form>
    </div>

    <script src="../shared/config.js"></script>
    <script src="script.js"></script>
</body>

</html>
